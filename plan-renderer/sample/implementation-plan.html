  <style id="component-styles">/* plan-renderer component styles.
 *
 * Chrome tokens (--bg, --surface, --card, --text, --muted, --accent, …)
 * come from the active palette (default: black-silver). Status tokens
 * (--st-*) are declared inline below so every distinct phase lifecycle,
 * item state, sub-state, and activity role gets its own semantic colour
 * – the renderer needs more than the usual RAG palette.
 *
 * Light is the default. Dark mode kicks in on [data-omnis-mode="dark"]
 * on <html>. */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

::selection { background: var(--selection-bg); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

a { color: var(--accent); }
code { background: var(--surface); padding: 0 .25em; border-radius: 3px; }

/* ─── Semantic status palette (light) ───────────────────────────
 *
 * Each named state has three rgba variants: solid text colour, soft
 * background, and ~30% border. Every distinct state gets its own hue
 * so the user never has to disambiguate "which kind of done is this"
 * from context alone. The only deliberate aliases are:
 *   – pending == idle (semantically identical: "not started")
 *   – blocked is one colour across all three layers (a phase, item
 *     or sub-state is blocked is blocked) */

:root {
  /* pending / idle – slate */
  --st-pending:           #64748B;
  --st-pending-bg:        rgba(100,116,139,0.10);
  --st-pending-border:    rgba(100,116,139,0.32);

  /* current (phase lifecycle: this phase is live) – sky */
  --st-current:           #0284C7;
  --st-current-bg:        rgba(2,132,199,0.10);
  --st-current-border:    rgba(2,132,199,0.32);

  /* in-progress (item: this bullet is being worked on) – amber */
  --st-in-progress:       #D97706;
  --st-in-progress-bg:    rgba(217,119,6,0.10);
  --st-in-progress-border:rgba(217,119,6,0.32);

  /* done (item: bullet finished on disk, pre-review) – emerald */
  --st-done:              #10B981;
  --st-done-bg:           rgba(16,185,129,0.10);
  --st-done-border:       rgba(16,185,129,0.32);

  /* ready (sub-state: inner-review loop is clean, awaiting outer
     review) – lime; sits between done (item) and completed (lifecycle) */
  --st-ready:             #65A30D;
  --st-ready-bg:          rgba(101,163,13,0.10);
  --st-ready-border:      rgba(101,163,13,0.32);

  /* completed (phase lifecycle: outer reviewer signed off, terminal) –
     deep emerald, darker than item done for terminal weight */
  --st-completed:         #047857;
  --st-completed-bg:      rgba(4,120,87,0.12);
  --st-completed-border:  rgba(4,120,87,0.40);

  /* blocked (any layer) – crimson */
  --st-blocked:           #DC2626;
  --st-blocked-bg:        rgba(220,38,38,0.12);
  --st-blocked-border:    rgba(220,38,38,0.35);

  /* under-review (phase lifecycle: outer reviewer running) – indigo */
  --st-under-review:      #4F46E5;
  --st-under-review-bg:   rgba(79,70,229,0.10);
  --st-under-review-border:rgba(79,70,229,0.32);

  /* inner-review (sub-state: review-iterate running) – violet,
     intentionally distinct from under-review indigo */
  --st-inner-review:      #7C3AED;
  --st-inner-review-bg:   rgba(124,58,237,0.10);
  --st-inner-review-border:rgba(124,58,237,0.32);

  /* needs-fixes (phase lifecycle: outer review left findings) – orange */
  --st-needs-fixes:       #EA580C;
  --st-needs-fixes-bg:    rgba(234,88,12,0.10);
  --st-needs-fixes-border:rgba(234,88,12,0.32);

  /* applying-fixes (sub-state: implementer is consuming inner-review
     findings) – magenta, intentionally distinct from needs-fixes orange */
  --st-applying-fixes:    #DB2777;
  --st-applying-fixes-bg: rgba(219,39,119,0.10);
  --st-applying-fixes-border:rgba(219,39,119,0.32);

  /* coding (sub-state: implementer writing code) – teal */
  --st-coding:            #0D9488;
  --st-coding-bg:         rgba(13,148,136,0.10);
  --st-coding-border:     rgba(13,148,136,0.32);

  /* activity roles */
  --st-implementer:       #0D9488;   /* teal, matches coding */
  --st-reviewer:          #1E40AF;   /* navy, distinct from current sky */
}

/* Dark-mode overrides – brighter, lower-saturation pastel variants so
   text reads cleanly against #0A0A0C. */
[data-omnis-mode="dark"] {
  --st-pending:           #94A3B8;
  --st-pending-bg:        rgba(148,163,184,0.14);
  --st-pending-border:    rgba(148,163,184,0.30);

  --st-current:           #38BDF8;
  --st-current-bg:        rgba(56,189,248,0.14);
  --st-current-border:    rgba(56,189,248,0.30);

  --st-in-progress:       #FBBF24;
  --st-in-progress-bg:    rgba(251,191,36,0.14);
  --st-in-progress-border:rgba(251,191,36,0.30);

  --st-done:              #34D399;
  --st-done-bg:           rgba(52,211,153,0.14);
  --st-done-border:       rgba(52,211,153,0.30);

  --st-ready:             #A3E635;
  --st-ready-bg:          rgba(163,230,53,0.14);
  --st-ready-border:      rgba(163,230,53,0.32);

  --st-completed:         #059669;
  --st-completed-bg:      rgba(5,150,105,0.18);
  --st-completed-border:  rgba(5,150,105,0.42);

  --st-blocked:           #FB7185;
  --st-blocked-bg:        rgba(251,113,133,0.16);
  --st-blocked-border:    rgba(251,113,133,0.35);

  --st-under-review:      #818CF8;
  --st-under-review-bg:   rgba(129,140,248,0.14);
  --st-under-review-border:rgba(129,140,248,0.30);

  --st-inner-review:      #C4B5FD;
  --st-inner-review-bg:   rgba(196,181,253,0.14);
  --st-inner-review-border:rgba(196,181,253,0.30);

  --st-needs-fixes:       #FB923C;
  --st-needs-fixes-bg:    rgba(251,146,60,0.14);
  --st-needs-fixes-border:rgba(251,146,60,0.30);

  --st-applying-fixes:    #F472B6;
  --st-applying-fixes-bg: rgba(244,114,182,0.14);
  --st-applying-fixes-border:rgba(244,114,182,0.32);

  --st-coding:            #5EEAD4;
  --st-coding-bg:         rgba(94,234,212,0.13);
  --st-coding-border:     rgba(94,234,212,0.30);

  --st-implementer:       #5EEAD4;
  --st-reviewer:          #60A5FA;
}

/* ─── App chrome ──────────────────────────────────────────────── */

/* The bar pins to the top of the viewport so it stays in view while
   the user scrolls through phases. Box-shadow gives a subtle
   separation when content scrolls under it. */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 24px;
  background: var(--sidebar);
  color: var(--on-sidebar);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
}
.app-bar .app-title {
  font-weight: 600;
  font-size: 18px;
  letter-spacing: .02em;
  color: var(--on-sidebar-active);
}
.app-bar .controls { display: flex; gap: 8px; }

main {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ─── Cards ───────────────────────────────────────────────────── */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  box-shadow: var(--shadow-soft);
}
.card h2 {
  margin: 0 0 12px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

.plan-header { padding: 16px 20px; }
.plan-intro {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}
.phase-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.card-flow { padding: 12px 16px; }
.card-flow pre.mermaid,
.card-flow .mermaid-rendered {
  background: var(--surface);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  display: flex;
  justify-content: center;
}
.mermaid-rendered svg { max-width: 100%; height: auto; }

/* ── Mermaid node theming ─────────────────────────────────────── */
/* Phase Flow nodes share the lifecycle palette. Defaults to pending;
   class overrides target done/completed, current/inProgress/active,
   blocked, needsFixes, underReview. !important beats the inline
   fill="…" mermaid emits for classDef hex colours. */

.mermaid-rendered g.node > rect,
.mermaid-rendered g.node > polygon,
.mermaid-rendered g.node > path,
.mermaid-rendered g.node > circle,
.mermaid-rendered g.node > ellipse {
  fill: var(--st-pending) !important;
  stroke: var(--st-pending) !important;
}
.mermaid-rendered g.node .nodeLabel,
.mermaid-rendered g.node .nodeLabel > p,
.mermaid-rendered g.node foreignObject span,
.mermaid-rendered g.node foreignObject p {
  color: #FFFFFF !important;
  fill: #FFFFFF !important;
}

/* Phase-level completion in Mermaid uses the deep terminal emerald.
   `done` is a legacy alias for `completed` at the phase level – Mermaid
   nodes don't represent items, so this is the lifecycle colour. */
.mermaid-rendered g.node.done > rect,
.mermaid-rendered g.node.completed > rect,
.mermaid-rendered g.node.done > polygon,
.mermaid-rendered g.node.completed > polygon,
.mermaid-rendered g.node.done > path,
.mermaid-rendered g.node.completed > path,
.mermaid-rendered g.node.done > circle,
.mermaid-rendered g.node.completed > circle,
.mermaid-rendered g.node.done > ellipse,
.mermaid-rendered g.node.completed > ellipse {
  fill: var(--st-completed) !important;
  stroke: var(--st-completed) !important;
}

.mermaid-rendered g.node.current > rect,
.mermaid-rendered g.node.inProgress > rect,
.mermaid-rendered g.node.active > rect,
.mermaid-rendered g.node.current > polygon,
.mermaid-rendered g.node.inProgress > polygon,
.mermaid-rendered g.node.active > polygon,
.mermaid-rendered g.node.current > path,
.mermaid-rendered g.node.inProgress > path,
.mermaid-rendered g.node.active > path,
.mermaid-rendered g.node.current > circle,
.mermaid-rendered g.node.inProgress > circle,
.mermaid-rendered g.node.active > circle,
.mermaid-rendered g.node.current > ellipse,
.mermaid-rendered g.node.inProgress > ellipse,
.mermaid-rendered g.node.active > ellipse {
  fill: var(--st-current) !important;
  stroke: var(--st-current) !important;
}

.mermaid-rendered g.node.blocked > rect,
.mermaid-rendered g.node.blocked > polygon,
.mermaid-rendered g.node.blocked > path,
.mermaid-rendered g.node.blocked > circle,
.mermaid-rendered g.node.blocked > ellipse {
  fill: var(--st-blocked) !important;
  stroke: var(--st-blocked) !important;
}

.mermaid-rendered g.node.needsFixes > rect,
.mermaid-rendered g.node.needsFixes > polygon,
.mermaid-rendered g.node.needsFixes > path,
.mermaid-rendered g.node.needsFixes > circle,
.mermaid-rendered g.node.needsFixes > ellipse {
  fill: var(--st-needs-fixes) !important;
  stroke: var(--st-needs-fixes) !important;
}

.mermaid-rendered g.node.underReview > rect,
.mermaid-rendered g.node.underReview > polygon,
.mermaid-rendered g.node.underReview > path,
.mermaid-rendered g.node.underReview > circle,
.mermaid-rendered g.node.underReview > ellipse {
  fill: var(--st-under-review) !important;
  stroke: var(--st-under-review) !important;
}

.mermaid-rendered .edgePath .path,
.mermaid-rendered .flowchart-link {
  stroke: var(--border-strong) !important;
}
.mermaid-rendered .arrowheadPath,
.mermaid-rendered marker path {
  fill: var(--border-strong) !important;
  stroke: var(--border-strong) !important;
}
.mermaid-rendered .edgeLabel {
  background-color: var(--surface) !important;
  color: var(--muted) !important;
}

/* ─── Status chips (phase lifecycle + item state) ─────────────── */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid transparent;
  background: var(--st-pending-bg);
  color: var(--st-pending);
  border-color: var(--st-pending-border);
  text-transform: lowercase;
  letter-spacing: .02em;
}
.chip-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.chip-tiny {
  padding: 0 8px;
  font-size: 13px;
  height: 18px;
  line-height: 18px;
}

/* lifecycle */
.chip-pending      { color: var(--st-pending);        background: var(--st-pending-bg);        border-color: var(--st-pending-border); }
.chip-current      { color: var(--st-current);        background: var(--st-current-bg);        border-color: var(--st-current-border); }
.chip-under-review { color: var(--st-under-review);   background: var(--st-under-review-bg);   border-color: var(--st-under-review-border); }
.chip-needs-fixes  { color: var(--st-needs-fixes);    background: var(--st-needs-fixes-bg);    border-color: var(--st-needs-fixes-border); }
.chip-completed    { color: var(--st-completed);      background: var(--st-completed-bg);      border-color: var(--st-completed-border); }
.chip-blocked      { color: var(--st-blocked);        background: var(--st-blocked-bg);        border-color: var(--st-blocked-border); }

/* item state */
.chip-in-progress  { color: var(--st-in-progress);    background: var(--st-in-progress-bg);    border-color: var(--st-in-progress-border); }
.chip-done         { color: var(--st-done);           background: var(--st-done-bg);           border-color: var(--st-done-border); }

/* sub-state */
.chip-idle           { color: var(--st-pending);        background: var(--st-pending-bg);        border-color: var(--st-pending-border); }
.chip-coding         { color: var(--st-coding);         background: var(--st-coding-bg);         border-color: var(--st-coding-border); }
.chip-inner-review   { color: var(--st-inner-review);   background: var(--st-inner-review-bg);   border-color: var(--st-inner-review-border); }
.chip-applying-fixes { color: var(--st-applying-fixes); background: var(--st-applying-fixes-bg); border-color: var(--st-applying-fixes-border); }
.chip-ready          { color: var(--st-ready);          background: var(--st-ready-bg);          border-color: var(--st-ready-border); }

/* ─── Phase cards ─────────────────────────────────────────────── */

.phases { display: flex; flex-direction: column; gap: 12px; }

.phase {
  padding: 0;
  overflow: hidden;
  border-left: 3px solid var(--border-strong);
}
.phase-pending      { border-left-color: var(--st-pending-border); }
.phase-current      { border-left-color: var(--st-current-border); }
.phase-under-review { border-left-color: var(--st-under-review-border); }
.phase-needs-fixes  { border-left-color: var(--st-needs-fixes-border); }
.phase-completed    { border-left-color: var(--st-completed-border); }
.phase-blocked      { border-left-color: var(--st-blocked-border); }

.phase-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
}
.phase-head:hover { background: var(--surface); }
.phase-num {
  font-family: ui-monospace, monospace;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: .04em;
}
.phase-title {
  flex: 1;
  font-weight: 500;
  font-size: 16px;
  color: var(--text);
}

.phase-body {
  padding: 0 20px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.phase.collapsed .phase-body { display: none; }
.phase.collapsed .phase-head { border-top: none; }

.phase-intro {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 15px;
}
.phase-intro-block {

  <script id="plan-md" type="text/plain"># ecogenie-ai-observatory Implementation Plan

The dashboard for the Agent Run Observatory MVP: a Next.js 16 + React 19 + TypeScript + Tailwind app that shows a workflow-like view of one selected agent run at a time. It is **API-only**: every datum it shows comes from the backend's HTTP or SSE endpoints. No direct database access, no spec-file parsing, no client-side reconciliation. The backend (in the `ecogenie-backend-ai-agent` repo) owns projection storage, planned-graph derivation, reconciliation, and the API/SSE surface — see that repo's `docs/implementation-plan.md` for the contract this UI consumes. The Next.js scaffold, the `src/lib/agent-api.ts` client, the `/api/agent/...` server-side proxy, and the existing `AgentConsole` placeholder are already in place; this plan layers the observatory dashboard on top.

## Phase Flow
```mermaid
flowchart TD
    P0["Phase 0: Observatory dashboard shell on the existing app + run list"] --> P1["Phase 1: Flowchart visualization with status indicators"]
    P1 --> P2["Phase 2: Node detail popout + disabled external detail fetch"]
    P2 --> P3["Phase 3: Live SSE projection updates and polish"]

    class P0 done
    class P1 current
    class P2 pending
    class P3 pending
```

## Phase Status
| Phase | Status |
|---|---|
| Phase 0 | completed |
| Phase 1 | current |
| Phase 2 | pending |
| Phase 3 | pending |

## Recommended Execution Order
1. Phase 0 — Observatory dashboard shell on the existing app + run list
2. Phase 1 — Flowchart visualization with status indicators
3. Phase 2 — Node detail popout + disabled external detail fetch
4. Phase 3 — Live SSE projection updates and polish

## Automation Contract
- **Stack (already scaffolded in this repo)**: Next.js 16 (App Router, `src/` directory layout), React 19, TypeScript 6, Tailwind 4, ESLint 10, `lucide-react` icons.
- **Important — Next.js 16 caveats**: per `AGENTS.md` at the repo root, this Next.js has breaking changes from earlier versions. Implementers must consult `node_modules/next/dist/docs/` before writing new code.
- **Gates** (run from this repo's root): `npm run lint` is the static-quality gate. `npm test` (Jest + React Testing Library) is added by Phase 0 — once added it is the test gate. Implementers run only lint; reviewers run lint + tests.
- **New dependencies introduced by this plan**: Phase 0 — `jest`, `@testing-library/react`, `@testing-library/jest-dom`, `jest-environment-jsdom`, `ts-jest`. Phase 1 — `@xyflow/react` (ReactFlow). No other new deps unless a phase's Work block names one.
- **Backend contract.** The complete observatory HTTP + SSE surface is defined in [`ecogenie-backend-ai-agent/docs/implementation-plan.md`](../../ecogenie-backend-ai-agent/docs/implementation-plan.md). The browser connects only through the Next.js proxy routes added by Phase 0.
- **No back doors**: the UI must not read MongoDB, parse spec JSON, or run a reconciler.
- **Scope**: internal-only; no auth flows beyond `sourceKey` propagation; not deployed.

## Definition of Done
- The dashboard renders on the existing app shell's `Overview` route: full-width flowchart main column with a collapsible right-docked sidebar.
- The run list is driven by the backend run-index endpoint; selecting a run renders its full-width, vertically scrolling flowchart.
- Every node shows the correct status colour using the live graph the backend returns.
- Adjusting the threshold control causes an API re-fetch with the new `threshold` value.
- Clicking a node opens the overlay detail drawer with the compact projection fields.
- The graph updates live for in-progress runs via the existing SSE stream.
- `npm run lint` clean and `npm test` green.

Status: pending

## Phase 3: Live SSE projection updates and polish
Status: pending

Make it a live operational snapshot for in-progress runs over the existing SSE stream, and harden.

### Work
- [w1] Subscribe the selected run to the existing SSE stream proxied through `src/app/api/observatory/stream/`. Apply incoming reconciled node-level update events directly to the live graph in state.
- [w2] Show a run-level "live" indicator; auto-follow newest activity with an opt-out to pin scroll.
- [w3] Handle SSE disconnect/reconnect with backfill via a single-run endpoint re-fetch at the current threshold; do not duplicate nodes.

- [a3] A large live run stays interactive (scroll, select) within an acceptable frame budget.
- [a4] Each empty/error state renders a clear, correct UI rather than a blank or broken canvas.

## Decisions
- **UI is API-only.** No direct database access, no spec-file parsing, no client-side reconciliation. The only contract surface is the backend's Phase 4 HTTP + SSE endpoints in `ecogenie-backend-ai-agent`.
- **Contract is defined in the backend plan; this plan references it.** Endpoints, query parameters, payload shapes, defaults, and the disabled-detail response shape live in the backend plan. This plan does not restate them.
- **Backend reconciles; UI renders.** The single-run endpoint returns an already-reconciled live graph. SSE events are reconciled node updates. The UI applies events directly to in-memory state without recomputing status or aggregation.
- **Threshold via query parameter; re-fetch on change.** Default 5. Changing the threshold triggers a single-run endpoint re-fetch with the new value.
- **Aggregation is display-only on the client.** The backend decides which nodes are aggregates and how many they represent; the UI chooses only whether to render them expanded or collapsed.
- **Status colour palette has five tokens.** `planned` = neutral/gray; `done` = green; `running` = purple; `warning` = amber; `error` = red. Defined once in `src/lib/status-tokens.ts`.
- **Layout.** The diagram always shows exactly one agent workflow. The existing left nav sidebar is preserved as the app shell. The observatory adds a right-docked collapsible sidebar containing filters/threshold and the run list. The node-detail view is a separate dismissable overlay drawer.
- **Server-side proxy.** Browser → backend calls go through Next.js route handlers under `src/app/api/observatory/`.
- **Backend Phase 4 gates real dashboard acceptance.** UI Phase 0 can build the shell, typed client, proxy routes, and mocked contract tests before backend Phase 4 lands.
- **Repo separation.** This is the production-facing repo for the observatory dashboard. The backend lives in `ecogenie-backend-ai-agent`. The two are coupled only through the documented HTTP + SSE contract.
- **Disabled detail is a valid UI state.** Until telemetry/log/blob stores exist, detail affordances call the disabled detail-provider endpoint and render its disabled payload cleanly.
- **Document-driven contract accepted for MVP.** The exact shared contract shape is document-driven rather than enforced by OpenAPI, codegen, or shared types.
- **Next.js 16 is the chosen runtime, intentionally.** Per the repo's `AGENTS.md`, App-Router, route-handler, and config conventions have shifted from earlier versions.
- **Test framework: Jest + React Testing Library.** No end-to-end framework in scope.
- **The existing `AgentConsole` placeholder is unrelated to the observatory.** It can stay in the repo as a separate utility component.

## Open Questions

_(none — telemetry/log/blob architecture is intentionally stubbed and deferred, not blocking this MVP.)_

## Residual Risks
- **Backend↔UI contract drift (accepted, post-MVP).** No shared type system; the UI mirrors the backend contract in `observatory-types.ts` and can drift silently.
- **Stubbed detail surfaces limit usefulness.** Telemetry/log/blob drill-downs are disabled until those stores are selected in the backend plan.
- **Two-repo local dev**: running the dashboard requires both `ecogenie-backend-ai-agent` (backend) and this repo (dashboard) running locally with matching ports.
- **Next.js 16 unfamiliarity.** The chosen runtime has breaking changes from the version in most training data.

  <script id="renderer-js">// plan-renderer: turn a Plan-Contract markdown + a progress.json overlay
// into a structured, interactive HTML view.
//
// Source of truth: plan.md (reviewer-owned). Live state overlay:
// progress.json (implementer-owned). Renderer is deterministic – no
// LLM in the loop. Buttons emit copyable prompt strings to send back
// to the agent.

const STATE_ORDER = ["pending", "in-progress", "done", "blocked"];

const SUB_STATE_LABEL = {
  "idle": "idle",
  "coding": "coding",
  "inner-review": "inner review",
  "applying-fixes": "applying fixes",
  "ready": "ready for outer review",
  "blocked": "blocked",
};

const LIFECYCLE_LABEL = {
  "pending": "pending",
  "current": "current",
  "under-review": "under review",
  "needs-fixes": "needs fixes",
  "completed": "completed",
};

// ─── Parse ────────────────────────────────────────────────────────────────

function parsePlan(md) {
  const plan = {
    title: "",
    intro: "",
    phaseFlowMermaid: "",
    phaseStatus: {},      // phase number -> lifecycle string
    automationContract: "",
    definitionOfDone: [],
    phases: [],           // [{ num, title, statusLine, intro, work[], acceptance[] }]
    filesByPhase: {},     // phase number -> [{ id, text }]
    testPlanByPhase: {},  // phase number -> raw text
    decisions: [],        // [{ title, body }]
    openQuestions: [],
    risks: [],
  };

  // Title and intro
  const lines = md.split(/\r?\n/);
  let i = 0;
  while (i < lines.length && !lines[i].startsWith("# ")) i++;
  if (i < lines.length) {
    plan.title = lines[i].replace(/^# /, "").trim();
    i++;
  }
  const introBuf = [];
  while (i < lines.length && !lines[i].startsWith("## ")) {
    introBuf.push(lines[i]);
    i++;
  }
  plan.intro = introBuf.join("\n").trim();

  // Split remainder by ## sections
  const rest = lines.slice(i).join("\n");
  const sections = splitByHeading(rest, /^## (.+)$/m);

  for (const sec of sections) {
    const heading = sec.heading;
    const body = sec.body;
    if (heading === "Phase Flow") {
      const m = body.match(/```mermaid\s*([\s\S]*?)```/);
      plan.phaseFlowMermaid = m ? m[1].trim() : "";
    } else if (heading === "Phase Status") {
      plan.phaseStatus = parsePhaseStatusTable(body);
    } else if (heading === "Automation Contract") {
      plan.automationContract = body.trim();
    } else if (heading === "Definition of Done") {
      plan.definitionOfDone = parseBullets(body);
    } else if (/^Phase (\d+):/.test(heading)) {
      plan.phases.push(parsePhase(heading, body));
    } else if (heading === "Files to Create or Modify by Phase") {
      const subs = splitByHeading(body, /^### Phase (\d+)\s*$/m);
      for (const s of subs) {
        const num = parseInt(s.heading, 10);
        plan.filesByPhase[num] = parseTaggedBullets(s.body);
      }
    } else if (heading === "Test Plan") {
      const subs = splitByHeading(body, /^### Phase (\d+)\s*$/m);
      for (const s of subs) {
        const num = parseInt(s.heading, 10);
        plan.testPlanByPhase[num] = s.body.trim();
      }
    } else if (heading === "Decisions") {
      plan.decisions = parseDecisions(body);
    } else if (heading === "Open Questions") {
      plan.openQuestions = parseBullets(body);
    } else if (heading === "Residual Risks") {
      plan.risks = parseBullets(body);
    } else if (heading === "Recommended Execution Order") {
      // ignored – represented by Phase Flow + Phase headings
    }
  }

  // If Phase Status table missing, fall back to per-phase Status: line
  for (const phase of plan.phases) {
    if (!plan.phaseStatus[phase.num] && phase.statusLine) {
      plan.phaseStatus[phase.num] = phase.statusLine;
    }
  }

  return plan;
}

function splitByHeading(text, re) {
  const out = [];
  const lines = text.split(/\r?\n/);
  let current = null;
  for (const line of lines) {
    const m = line.match(re);
    if (m) {
      if (current) out.push(current);
      current = { heading: m[1].trim(), body: "" };
    } else if (current) {
      current.body += line + "\n";
    }
  }
  if (current) out.push(current);
  return out;
}

function parsePhase(heading, body) {
  const m = heading.match(/^Phase (\d+):\s*(.+)$/);
  const num = parseInt(m[1], 10);
  const title = m[2].trim();

  const phase = {
    num, title,
    statusLine: "",
    intro: "",
    work: [],
    acceptance: [],
  };

  // Find ### Work and ### Acceptance Criteria
  const subs = splitByHeading(body, /^### (.+)$/m);

  // intro: prose before first ### heading
  const firstSubAt = body.search(/^### /m);
  const preface = firstSubAt === -1 ? body : body.slice(0, firstSubAt);
  const prefaceLines = preface.split(/\r?\n/);
  const introBuf = [];
  for (const ln of prefaceLines) {
    const sm = ln.match(/^Status:\s*(.+)$/);
    if (sm) { phase.statusLine = sm[1].trim().toLowerCase(); continue; }
    introBuf.push(ln);
  }
  phase.intro = introBuf.join("\n").trim();

  for (const s of subs) {
    if (s.heading === "Work") {
      phase.work = parseTaggedBullets(s.body);
    } else if (s.heading === "Acceptance Criteria") {
      phase.acceptance = parseTaggedBullets(s.body);
    }
  }
  return phase;
}

function parsePhaseStatusTable(body) {
  const out = {};
  const rows = body.split(/\r?\n/).filter(l => l.trim().startsWith("|"));
  for (const row of rows) {
    const cells = row.split("|").map(c => c.trim()).filter(c => c.length > 0);
    if (cells.length < 2) continue;
    if (/^Phase$/i.test(cells[0]) || /^-+$/.test(cells[0])) continue;
    const m = cells[0].match(/Phase\s+(\d+)/i);
    if (!m) continue;
    out[parseInt(m[1], 10)] = cells[1].toLowerCase();
  }
  return out;
}

function parseBullets(body) {
  const out = [];
  const lines = body.split(/\r?\n/);
  let buf = null;
  for (const ln of lines) {
    if (/^-\s+/.test(ln)) {
      if (buf) out.push(buf.trim());
      buf = ln.replace(/^-\s+/, "");
    } else if (buf && /^\s+/.test(ln) && ln.trim().length > 0) {
      buf += " " + ln.trim();
    } else if (buf && ln.trim().length === 0) {
      out.push(buf.trim());
      buf = null;
    }
  }
  if (buf) out.push(buf.trim());
  return out;
}

function parseTaggedBullets(body) {
  // `- [w1] text` or `- text` (auto-assign id by index if missing).
  // Also extracts the review-implementation status surface from the bullet
  // text: trailing `✅` → marker "done"; trailing `⚠️`/`⚠` (optionally
  // followed by a `[partial: …]` note) → marker "partial". The marker lets
  // the renderer infer item state when the progress overlay is cleared
  // (review-implementation deletes a phase's progress block once the plan's
  // markdown is the authoritative record).
  const out = [];
  let autoIdx = 1;
  for (const raw of parseBullets(body)) {
    let text = raw;
    let marker = null;

    // GFM-style checkbox at the start: `[x] …` or `[ ] …`. (parseBullets has
    // already stripped the leading `- `.)
    const cb = text.match(/^\[([ xX])\]\s+(.*)$/);
    if (cb) {
      marker = cb[1].toLowerCase() === "x" ? "done" : "pending";
      text = cb[2];
    }

    // Trailing status icon. The "done" icon wins outright; the "partial"
    // icon only sets the marker when no stronger signal is already set.
    // A bracketed reason after the icon is preserved as part of the text.
    let im = text.match(/^(.*?)\s*(✅)\s*(\[[^\]]*\])?\s*$/);
    if (im) {
      marker = "done";
      text = im[3] ? (im[1].trimEnd() + " " + im[3]) : im[1].trimEnd();
    } else {
      im = text.match(/^(.*?)\s*(⚠️|⚠)\s*(\[[^\]]*\])?\s*$/);
      if (im) {
        if (marker !== "done") marker = "partial";
        text = im[3] ? (im[1].trimEnd() + " " + im[3]) : im[1].trimEnd();
      }
    }

    const m = text.match(/^\[([wfa]\d+|[a-z]+\d+)\]\s+(.+)$/i);
    if (m) {
      out.push({ id: m[1].toLowerCase(), text: m[2], marker });
    } else {
      // auto-id; prefix derived from caller context isn't known here,
      // so we use plain numbering and the caller can prefix as needed.
      out.push({ id: String(autoIdx), text, marker });
    }
    autoIdx++;
  }
  return out;
}

function parseDecisions(body) {
  const out = [];
  const bullets = parseBullets(body);
  for (const b of bullets) {
    // Pattern: **Title.** body…  or  **Title** body…
    const m = b.match(/^\*\*([^*]+?)\*\*\.?\s*(.*)$/);
    if (m) {
      out.push({ title: m[1].trim().replace(/\.$/, ""), body: m[2].trim() });
    } else {
      out.push({ title: "", body: b });
    }
  }
  return out;
}

// ─── Merge plan + progress ───────────────────────────────────────────────

function mergeProgress(plan, progress) {
  if (!progress) return plan;
  for (const phase of plan.phases) {
    const p = progress.phases?.[phase.num];
    if (!p) continue;
    phase.progress = p;
  }
  plan._progress = progress;
  return plan;
}

// ─── Render ──────────────────────────────────────────────────────────────

// ─── Inline markdown ─────────────────────────────────────────────────────
// Minimal inline transforms applied to plan prose: **bold**, _italic_,
// `code`, [label](url). Block-level structure is already handled by the
// section parser, so this is purely span-level.

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderInline(text) {
  if (text == null) return "";
  let s = escapeHtml(text);

  // Code spans first – their content must not be re-processed by later
  // transforms. Stash with a private placeholder.
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `␀C${codes.push(c) - 1}␀`);

  // Links: [label](url) – restrict url to a safe-ish charset.
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
    const safe = url.replace(/"/g, "&quot;");
    return `<a href="${safe}" target="_blank" rel="noopener">${label}</a>`;
  });

  // Bold: **text**
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");

  // Italic: _text_ (avoids collision with ** since we already removed bold)
  s = s.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,;:!?)])/g, "$1<em>$2</em>");

  // Restore code spans last.
  s = s.replace(/␀C(\d+)␀/g, (_, i) => `<code>${codes[+i]}</code>`);

  return s;
}

// Render a multi-line prose block: extracts ```mermaid``` and other fenced
// code blocks into proper <pre> elements, and renders the remaining text as
// paragraphs (separated by blank lines) with renderInline applied. Used for
// phase intros where authors may embed sequence/class/ER diagrams.
function renderProseBlocks(text, container) {
  const fenceRe = /```(\w+)?\n([\s\S]*?)```/g;
  let lastIndex = 0;
  let m;
  while ((m = fenceRe.exec(text)) !== null) {
    const before = text.slice(lastIndex, m.index);
    emitProseParagraphs(before, container);
    const lang = (m[1] || "").toLowerCase();
    const body = m[2].replace(/\s+$/, "");
    if (lang === "mermaid") {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = body;
      container.appendChild(pre);
    } else {
      const pre = document.createElement("pre");
      pre.className = "code-block";
      const code = document.createElement("code");
      if (lang) code.className = `lang-${lang}`;
      code.textContent = body;
      pre.appendChild(code);
      container.appendChild(pre);
    }
    lastIndex = m.index + m[0].length;
  }
  emitProseParagraphs(text.slice(lastIndex), container);
}

function emitProseParagraphs(text, container) {
  const trimmed = text.replace(/^\s+|\s+$/g, "");
  if (!trimmed) return;
  for (const p of trimmed.split(/\n\s*\n/)) {
    const t = p.trim();
    if (!t) continue;
    container.appendChild(el("p", { className: "phase-intro", html: renderInline(t) }));
  }
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "className") node.className = v;
    else if (k === "onClick") node.addEventListener("click", v);
    else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    if (typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  }
  return node;
}

function renderPlan(plan, root) {
  root.innerHTML = "";
  setAppTitle(plan.title);
  root.appendChild(renderHeader(plan));
  if (plan.phaseFlowMermaid) root.appendChild(renderPhaseFlow(plan));
  root.appendChild(renderPhasesPanel(plan));
  root.appendChild(renderDecisions(plan));
  root.appendChild(renderFooterSections(plan));
}

function setAppTitle(title) {
  if (!title) return;
  const bar = document.querySelector(".app-bar .app-title");
  if (bar) bar.innerHTML = renderInline(title);
  document.title = title;
}

function renderHeader(plan) {
  const chips = plan.phases.map(ph => {
    const state = (plan.phaseStatus[ph.num] || "pending").toLowerCase();
    return el("span", { className: `chip chip-${state}` }, [
      el("span", { className: "chip-dot" }),
      `P${ph.num} ${LIFECYCLE_LABEL[state] || state}`,
    ]);
  });
  return el("header", { className: "plan-header" }, [
    el("p", { className: "plan-intro", html: renderInline(plan.intro) }),
    el("div", { className: "phase-chips" }, chips),
  ]);
}

function renderPhaseFlow(plan) {
  const card = el("section", { className: "card card-flow" });
  card.appendChild(el("h2", {}, "Phase Flow"));
  const pre = el("pre", { className: "mermaid" }, plan.phaseFlowMermaid);
  card.appendChild(pre);
  return card;
}

function renderPhasesPanel(plan) {
  const wrap = el("section", { className: "phases" });
  for (const phase of plan.phases) {
    const state = (plan.phaseStatus[phase.num] || "pending").toLowerCase();
    wrap.appendChild(renderPhase(phase, state, plan));
  }
  return wrap;
}

function renderPhase(phase, state, plan) {
  const expanded = readExpandState(phase.num, state === "current");
  const card = el("article", { className: `card phase phase-${state}`, "data-phase": phase.num });

  // Header (always visible)
  const head = el("div", {
    className: "phase-head",
    role: "button",
    "aria-expanded": expanded ? "true" : "false",
    onClick: (e) => {
      const c = e.currentTarget.parentElement;
      c.classList.toggle("collapsed");
      const nowExpanded = !c.classList.contains("collapsed");
      e.currentTarget.setAttribute("aria-expanded", nowExpanded ? "true" : "false");
      writeExpandState(phase.num, nowExpanded);
    },
  }, [
    el("span", { className: "phase-num" }, `Phase ${phase.num}`),
    el("span", { className: "phase-title", html: renderInline(phase.title) }),
    el("span", { className: `chip chip-${state}` }, [
      el("span", { className: "chip-dot" }),
      LIFECYCLE_LABEL[state] || state,
    ]),
  ]);
  card.appendChild(head);
  if (!expanded) card.classList.add("collapsed");

  // Body
  const body = el("div", { className: "phase-body" });

  if (phase.progress) body.appendChild(renderLivePanel(phase));
  if (phase.intro) {
    const intro = el("div", { className: "phase-intro-block" });
    renderProseBlocks(phase.intro, intro);
    body.appendChild(intro);
  }

  // Two-col: Work | Files
  const grid = el("div", { className: "phase-grid" });
  grid.appendChild(renderItemList("Work", phase.work, phase.progress, phase.num, "work", state));
  const files = plan.filesByPhase[phase.num] || [];
  grid.appendChild(renderItemList("Files", files, phase.progress, phase.num, "files", state));
  body.appendChild(grid);

  // Acceptance full-width
  body.appendChild(renderItemList("Acceptance Criteria", phase.acceptance, phase.progress, phase.num, "acceptance", state));

  // Actions
  body.appendChild(renderPhaseActions(phase, state));

  card.appendChild(body);
  return card;
}

function renderLivePanel(phase) {
  const p = phase.progress;
  const sub = p.sub_state || "idle";
  const live = el("div", { className: `live-panel live-sub-${sub}` });
  const head = el("div", { className: "live-head" }, [
    el("span", { className: "live-label" }, SUB_STATE_LABEL[sub] || sub),
    el("span", { className: "live-sub" }, [
      el("span", { className: "live-meta" }, [
        el("span", { className: "live-meta-k" }, "sub-state"),
        el("span", { className: `live-substate sub-${sub}` }, SUB_STATE_LABEL[sub] || sub),
      ]),
      el("span", { className: "live-meta" }, [
        el("span", { className: "live-meta-k" }, "cycle"),
        el("span", { className: "live-cycle" }, [
          el("span", { className: "live-cycle-k" }, String(p.cycle ?? 1)),
          el("span", { className: "live-cycle-cap" }, ` / ${p.cycle_cap ?? 10}`),
        ]),
      ]),
      el("span", { className: "live-meta" }, [
        el("span", { className: "live-meta-k" }, "started"),
        el("span", {}, fmtTime(p.started_at)),
      ]),
      el("span", { className: "live-meta" }, [
        el("span", { className: "live-meta-k" }, "updated"),
        el("span", {}, fmtRelative(p.updated_at || phase.progress?.activity?.[0]?.at)),
      ]),
    ]),
  ]);
  live.appendChild(head);

  // Activity log – newest first regardless of write order. Implementers
  // append; the renderer sorts so a single forgotten prepend doesn't
  // bury the latest entry.
  if (p.activity?.length) {
    const log = el("ol", { className: "activity-log" });
    const sorted = [...p.activity].sort((a, b) => {
      const ta = a.at ? new Date(a.at).getTime() : 0;
      const tb = b.at ? new Date(b.at).getTime() : 0;
      return tb - ta;
    });
    for (const ev of sorted) {
      log.appendChild(el("li", { className: `activity activity-${ev.role}` }, [
        el("span", { className: "activity-time" }, fmtClock(ev.at)),
        el("span", { className: "activity-role" }, ev.role),
        el("span", { className: "activity-msg", html: renderInline(ev.msg) }),
      ]));
    }
    live.appendChild(log);
  }

  // Proposed decisions from implementer
  if (p.proposed_decisions?.length) {
    const prop = el("div", { className: "proposed-decisions" });
    prop.appendChild(el("div", { className: "proposed-label" }, `${p.proposed_decisions.length} proposed decision(s) from implementer`));
    for (const d of p.proposed_decisions) {
      prop.appendChild(el("div", { className: "proposed-card" }, [
        el("p", { className: "proposed-text", html: renderInline(d.text) }),
        el("p", { className: "proposed-just", html: renderInline(d.justification) }),
        el("div", { className: "actions" }, [
          el("button", {
            className: "btn",
            onClick: () => emitPrompt(
              `Apply this proposed decision to ## Decisions in the plan: "${d.text}". Justification recorded by the implementer: ${d.justification}.`
            ),
          }, "send to plan"),
          el("button", {
            className: "btn btn-ghost",
            onClick: () => emitPrompt(
              `Reject the implementer's proposed decision: "${d.text}". Explain in the plan or progress log why it was rejected.`
            ),
          }, "reject"),
        ]),
      ]));
    }
    live.appendChild(prop);
  }

  return live;
}

function renderItemList(label, items, progress, phaseNum, kind, phaseLifecycle) {
  const wrap = el("div", { className: `items items-${kind}` });
  wrap.appendChild(el("h4", { className: "items-label" }, label));
  if (!items.length) {
    wrap.appendChild(el("p", { className: "items-empty" }, "–"));
    return wrap;
  }
  const ul = el("ul", { className: "items-list" });
  for (const item of items) {
    // Resolve item state from progress overlay, then map to the effective
    // workflow state so the pill reflects "where this item sits right now"
    // and not just "is the file on disk".
    const itemId = normalizeItemId(item.id, kind);
    const progState = progress?.items?.[itemId]?.state;   // may be undefined
    const note = progress?.items?.[itemId]?.note;
    const eff = effectiveItemState(progState, item.marker, progress, phaseLifecycle);
    ul.appendChild(el("li", { className: `item item-${eff.state}` }, [
      el("span", { className: "item-id" }, itemId),
      el("span", { className: "item-text", html: renderInline(item.text) }),
      note && el("span", { className: "item-note", html: renderInline(note) }),
      el("span", { className: `chip chip-tiny chip-${eff.state}` }, eff.label),
    ]));
  }
  wrap.appendChild(ul);
  return wrap;
}

// Map an item's progress-overlay state (pending | in-progress | done |
// blocked, possibly undefined) plus the markdown status marker plus the
// phase's lifecycle and sub-state into a single label the user can act on.
//
// Rationale: implementers flip items to "done" as soon as the file is on
// disk, long before the inner reviewer signs off. A bare "done" pill mid
// inner-review lies about progress – we fold the surrounding context into
// the pill so the user sees the real story. After review-implementation
// promotes a phase to "completed" it clears that phase's progress block,
// so we also fall back to the markdown status surface (✅ markers on
// bullets, plus the phase lifecycle) to keep completed bullets reading as
// completed rather than reverting to "pending".
function effectiveItemState(progState, marker, progress, phaseLifecycle) {
  // 1) Explicit progress-overlay state wins – this is the live signal an
  // active phase writes per item, and the user has asked us to respect
  // "blocked" / "in-progress" even on a completed phase.
  if (progState === "blocked")     return { state: "blocked",     label: "blocked" };
  if (progState === "in-progress") return { state: "in-progress", label: "in progress" };
  if (progState === "done") {
    if (phaseLifecycle === "completed")    return { state: "completed",    label: "completed" };
    if (phaseLifecycle === "needs-fixes")  return { state: "needs-fixes",  label: "needs fixes" };
    if (phaseLifecycle === "under-review") return { state: "under-review", label: "under review" };
    if (phaseLifecycle === "blocked")      return { state: "blocked",      label: "blocked" };
    const sub = progress?.sub_state;
    if (sub === "ready")          return { state: "ready",          label: "ready for review" };
    if (sub === "applying-fixes") return { state: "applying-fixes", label: "applying fixes" };
    if (sub === "inner-review")   return { state: "inner-review",   label: "in inner review" };
    return { state: "done", label: "written" };
  }
  if (progState === "pending") return { state: "pending", label: "pending" };

  // 2) No per-item progress state. Fall back to the markdown markers the
  // reviewer left on the bullet.
  if (marker === "done")    return { state: "completed",   label: "completed" };
  if (marker === "partial") return { state: "in-progress", label: "in progress" };

  // 3) No bullet-level signal either. The phase lifecycle is then the
  // strongest hint we have – a completed phase implies its items shipped,
  // even if review-implementation cleared the overlay and the reviewer
  // didn't bother repainting every bullet with ✅.
  if (phaseLifecycle === "completed") return { state: "completed", label: "completed" };

  return { state: "pending", label: "pending" };
}

function normalizeItemId(rawId, kind) {
  // Files-to-Create-or-Modify bullets use [f1] naturally; Work uses [w1];
  // Acceptance uses [a1]. If the parser auto-assigned a plain number, add a prefix.
  if (/^[wfa]\d+$/i.test(rawId)) return rawId.toLowerCase();
  const prefix = kind === "work" ? "w" : kind === "files" ? "f" : kind === "acceptance" ? "a" : "x";
  return prefix + rawId;
}

function renderPhaseActions(phase, state) {
  const actions = el("div", { className: "phase-actions" });
  if (state === "current") {
    actions.appendChild(actionBtn("regenerate work", () =>
      emitPrompt(`Regenerate the ### Work bullets for Phase ${phase.num} of the implementation plan. Preserve existing acceptance criteria.`)));
    actions.appendChild(actionBtn("split this phase", () =>
      emitPrompt(`Split Phase ${phase.num} ("${phase.title}") into two smaller phases. Renumber subsequent phases.`)));
    actions.appendChild(actionBtn("ask implementer to pause", () =>
      emitPrompt(`Pause Phase ${phase.num} implementation. Save current progress.json state and wait for review.`)));
    actions.appendChild(actionBtn("promote to under-review", () =>
      emitPrompt(`Phase ${phase.num} implementation reports ready. Run review-implementation on Phase ${phase.num}.`)));
  } else if (state === "needs-fixes") {
    actions.appendChild(actionBtn("implement fixes", () =>
      emitPrompt(`Run implement-fixes for Phase ${phase.num}, applying the outstanding review findings.`)));
  } else if (state === "completed") {
    actions.appendChild(actionBtn("reopen", () =>
      emitPrompt(`Reopen Phase ${phase.num} ("${phase.title}"). Roll its lifecycle back to current and explain why in ## Decisions.`)));
  } else if (state === "pending") {
    actions.appendChild(actionBtn("start phase", () =>
      emitPrompt(`Start Phase ${phase.num} ("${phase.title}"). Run implement-phase on Phase ${phase.num}.`)));
  }
  return actions;
}

function actionBtn(label, onClick) {
  return el("button", { className: "btn", onClick }, label);
}

function renderDecisions(plan) {
  const card = el("section", { className: "card card-decisions" });
  const proposedCount = (plan._progress?.phases ? Object.values(plan._progress.phases) : [])
    .flatMap(p => p.proposed_decisions || []).length;
  card.appendChild(el("h2", {}, [
    `Decisions (${plan.decisions.length})`,
    proposedCount > 0 && el("span", { className: "badge badge-attention" }, `${proposedCount} proposed`),
  ]));
  const grid = el("div", { className: "decisions-grid" });
  for (const d of plan.decisions) {
    grid.appendChild(el("div", { className: "decision-card" }, [
      d.title && el("div", { className: "decision-title", html: renderInline(d.title) }),
      el("p", { className: "decision-body", html: renderInline(d.body) }),
      el("div", { className: "actions" }, [
        el("button", {
          className: "btn btn-ghost",
          onClick: () => emitPrompt(`Revisit this decision in ## Decisions: "${d.title || d.body}". Surface tradeoffs and propose alternatives.`),
        }, "revisit"),
        el("button", {
          className: "btn btn-ghost",
          onClick: () => emitPrompt(`Remove this decision from ## Decisions and explain why it no longer applies: "${d.title || d.body}".`),
        }, "remove"),
      ]),
    ]));
  }
  card.appendChild(grid);
  card.appendChild(el("div", { className: "decisions-tools" }, [
    el("button", {
      className: "btn",
      onClick: () => emitPrompt(`Add a new decision to ## Decisions. Topic: [fill in]. Recommend an option and list tradeoffs.`),
    }, "+ add decision"),
  ]));
  return card;
}

function renderFooterSections(plan) {
  const wrap = el("section", { className: "footer-sections" });

  // Open Questions
  const oq = el("div", { className: "card card-half" });
  oq.appendChild(el("h2", {}, `Open Questions (${plan.openQuestions.length})`));
  if (plan.openQuestions.length === 0) {
    oq.appendChild(el("p", { className: "muted", html: renderInline("_none_") }));
  } else {
    const ul = el("ul", {});
    for (const q of plan.openQuestions) ul.appendChild(el("li", { html: renderInline(q) }));
    oq.appendChild(ul);
  }
  oq.appendChild(el("button", {
    className: "btn btn-ghost",
    onClick: () => emitPrompt(`Append a new open question to ## Open Questions: [fill in]. This section is append-only.`),
  }, "+ add open question"));
  wrap.appendChild(oq);

  // Risks
  const risks = el("div", { className: "card card-half" });
  risks.appendChild(el("h2", {}, `Residual Risks (${plan.risks.length})`));
  if (plan.risks.length === 0) {
    risks.appendChild(el("p", { className: "muted", html: renderInline("_none_") }));
  } else {
    const ul = el("ul", {});
    for (const r of plan.risks) ul.appendChild(el("li", { html: renderInline(r) }));
    risks.appendChild(ul);
  }
  wrap.appendChild(risks);

  return wrap;
}

// ─── Prompt emit (toast + copy to clipboard) ─────────────────────────────

function emitPrompt(text) {
  navigator.clipboard?.writeText(text).catch(() => {});
  showToast(text);
}

function showToast(text) {
  const existing = document.getElementById("plan-toast");
  if (existing) existing.remove();
  const toast = el("div", { id: "plan-toast", className: "toast", role: "status" }, [
    el("div", { className: "toast-label" }, "prompt copied to clipboard – paste it into the agent"),
    el("pre", { className: "toast-prompt" }, text),
    el("button", { className: "btn btn-ghost toast-close", onClick: () => toast.remove() }, "dismiss"),
  ]);
  document.body.appendChild(toast);
  setTimeout(() => { if (document.body.contains(toast)) toast.classList.add("toast-fade"); }, 6000);
  setTimeout(() => toast.remove(), 7200);
}

// ─── Time helpers ────────────────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  return d.toLocaleString();
}
function fmtClock(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function fmtRelative(iso) {
  if (!iso) return "–";
  const ms = Date.now() - new Date(iso).getTime();
  const min = Math.round(ms / 60000);
  if (Math.abs(min) < 1) return "just now";
  if (Math.abs(min) < 60) return `${min} min ago`;
  const hr = Math.round(min / 60);
  if (Math.abs(hr) < 48) return `${hr} h ago`;
  return fmtTime(iso);
}

// ─── Theme ───────────────────────────────────────────────────────────────

function applyTheme(mode) {
  document.documentElement.setAttribute("data-omnis-palette", "black-silver");
  if (mode === "dark") {
    document.documentElement.setAttribute("data-omnis-mode", "dark");
  } else {
    document.documentElement.removeAttribute("data-omnis-mode");
  }
  // Theme mermaid too
  if (window.mermaid) {
    window.mermaid.initialize({
      startOnLoad: false,
      theme: mode === "dark" ? "dark" : "default",
      securityLevel: "loose",
    });
  }
}

function initThemeToggle() {
  const saved = localStorage.getItem("plan-renderer-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(saved);
  const btn = document.getElementById("theme-toggle");
  btn.textContent = saved === "dark" ? "light mode" : "dark mode";
  btn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-omnis-mode") === "dark" ? "dark" : "light";
    const next = cur === "dark" ? "light" : "dark";
    localStorage.setItem("plan-renderer-theme", next);
    applyTheme(next);
    btn.textContent = next === "dark" ? "light mode" : "dark mode";
    // Re-render mermaid with the new theme
    rerenderMermaid();
  });
}

async function rerenderMermaid() {
  if (!window.mermaid) return;
  const blocks = document.querySelectorAll("pre.mermaid, .mermaid-rendered");
  for (const b of blocks) {
    if (b.classList.contains("mermaid-rendered")) {
      // restore source from data attribute
      const src = b.getAttribute("data-mermaid-src");
      if (src) {
        const pre = document.createElement("pre");
        pre.className = "mermaid";
        pre.textContent = src;
        b.replaceWith(pre);
      }
    }
  }
  await renderMermaid();
}

async function renderMermaid() {
  if (!window.mermaid) return;
  const blocks = document.querySelectorAll("pre.mermaid");
  let i = 0;
  for (const b of blocks) {
    const src = b.textContent;
    try {
      const { svg } = await window.mermaid.render(`mmd-${Date.now()}-${i++}`, src);
      const div = document.createElement("div");
      div.className = "mermaid-rendered";
      div.setAttribute("data-mermaid-src", src);
      div.innerHTML = svg;
      b.replaceWith(div);
    } catch (err) {
      console.error("mermaid render failed:", err);
    }
  }
}

// ─── Auto-refresh ────────────────────────────────────────────────────────

const REFRESH_CYCLE = [0, 5, 15, 60];   // seconds; 0 = off

function refreshLabel(sec) {
  return sec === 0 ? "auto-refresh: off" : `auto-refresh: ${sec}s`;
}

function initRefreshToggle() {
  const btn = document.getElementById("refresh-toggle");
  if (!btn) return;
  let cur = parseInt(localStorage.getItem("plan-renderer-refresh") || "0", 10);
  if (!REFRESH_CYCLE.includes(cur)) cur = 0;
  btn.textContent = refreshLabel(cur);
  scheduleReload(cur);
  btn.addEventListener("click", () => {
    const idx = (REFRESH_CYCLE.indexOf(cur) + 1) % REFRESH_CYCLE.length;
    cur = REFRESH_CYCLE[idx];
    localStorage.setItem("plan-renderer-refresh", String(cur));
    btn.textContent = refreshLabel(cur);
    scheduleReload(cur);
  });
}

let _reloadTimer = null;
function scheduleReload(sec) {
  if (_reloadTimer) { clearTimeout(_reloadTimer); _reloadTimer = null; }
  if (sec > 0) {
    _reloadTimer = setTimeout(() => {
      saveScroll();
      location.reload();
    }, sec * 1000);
  }
}

// Save on every unload (auto-refresh, F5, Ctrl+R, navigating away) so the
// scroll position survives both the timer-driven reload and a manual one.
function saveScroll() {
  try { sessionStorage.setItem("plan-renderer-scroll", String(window.scrollY)); } catch {}
}
function initScrollPersistence() {
  window.addEventListener("beforeunload", saveScroll);
  window.addEventListener("pagehide", saveScroll);
}

function restoreScroll() {
  const y = parseInt(sessionStorage.getItem("plan-renderer-scroll") || "0", 10);
  if (y > 0) {
    requestAnimationFrame(() => window.scrollTo(0, y));
  }
}

// Expand/collapse persistence – sessionStorage keyed by phase number,
// so each phase remembers its open/closed state across refreshes.
// Defaults (used when no entry exists yet) come from the caller –
// typically "open if this is the current phase, closed otherwise".
const EXPAND_KEY = "plan-renderer-expand";
function readExpandMap() {
  try {
    const raw = sessionStorage.getItem(EXPAND_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function readExpandState(phaseNum, fallback) {
  const map = readExpandMap();
  const v = map[String(phaseNum)];
  return typeof v === "boolean" ? v : !!fallback;
}
function writeExpandState(phaseNum, expanded) {
  const map = readExpandMap();
  map[String(phaseNum)] = !!expanded;
  try { sessionStorage.setItem(EXPAND_KEY, JSON.stringify(map)); } catch {}
}

// ─── Boot ────────────────────────────────────────────────────────────────

async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
  return r.text();
}

async function fetchJsonOrNull(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch {
    return null;
  }
}

// Read inline data baked into the HTML by bake.mjs, if present.
function readInlinePlan() {
  const el = document.getElementById("plan-md");
  return el ? el.textContent : null;
}
function readInlineProgress() {
  const el = document.getElementById("plan-progress");
  if (!el) return null;
  const txt = el.textContent.trim();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch (e) {
    console.error("inline progress JSON parse failed:", e);
    return null;
  }
}

async function loadSources() {
  // Prefer baked-in data.
  const inlinePlan = readInlinePlan();
  if (inlinePlan != null) {
    return { planMd: inlinePlan, progress: readInlineProgress(), mode: "baked" };
  }
  // Fall back to fetching from the served folder (dev mode).
  const params = new URLSearchParams(location.search);
  const planUrl = params.get("plan") || "sample/implementation-plan.md";
  const progressUrl = params.get("progress") || planUrl.replace(/\.md$/, ".progress.json");
  const planMd = await fetchText(planUrl);
  const progress = await fetchJsonOrNull(progressUrl);
  return { planMd, progress, mode: "fetched" };
}

async function boot() {
  initThemeToggle();
  initRefreshToggle();
  initScrollPersistence();
  // Browsers default to "auto" scroll restoration on history navigation,
  // which can fight our sessionStorage-driven restore. Disable it.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  const root = document.getElementById("plan-root");
  root.innerHTML = '<p class="muted">loading…</p>';

  let sources;
  try {
    sources = await loadSources();
  } catch (err) {
    root.innerHTML = `<p class="muted">failed to load plan: ${err.message}. If you opened the un-baked dev page from <code>file://</code>, either run <code>node bake.mjs</code> to produce a self-contained file or serve the folder via HTTP.</p>`;
    return;
  }

  const plan = mergeProgress(parsePlan(sources.planMd), sources.progress);
  renderPlan(plan, root);
  await renderMermaid();
  restoreScroll();
}

window.addEventListener("DOMContentLoaded", boot);
</script>
